name: Visual Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'math-tutor-frontend/src/**'
      - 'math-tutor-frontend/scripts/**'
      - 'math-tutor-frontend/docs/**'
      - 'math-tutor-frontend/package.json'
      - 'math-tutor-frontend/package-lock.json'
      - 'math-tutor-frontend/vite.config.ts'

jobs:
  visual-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math-tutor-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: math-tutor-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright package
        run: npm install -D playwright --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Run strict visual gate
        run: npm run visual:gate
