name: Quality Gates

on:
  pull_request:
    branches:
      - staging
      - main
    paths:
      - '.github/workflows/**'
      - 'apps/api/**'
      - 'math-tutor-frontend/src/**'
      - 'math-tutor-frontend/package.json'
      - 'math-tutor-frontend/package-lock.json'
      - 'math-tutor-frontend/tsconfig*.json'
      - 'math-tutor-frontend/eslint.config.js'
      - 'math-tutor-frontend/vite.config.ts'
      - 'math-tutor-frontend/vitest.config.ts'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: math-tutor-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: math-tutor-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build Stage Bundle
        run: npm run build:stage

      - name: Test
        run: npm run test

  api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
