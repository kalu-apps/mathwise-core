name: Core Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'math-tutor-frontend/src/**'
      - 'math-tutor-frontend/package.json'
      - 'math-tutor-frontend/package-lock.json'
      - 'math-tutor-frontend/tsconfig*.json'
      - 'math-tutor-frontend/eslint.config.js'
      - 'math-tutor-frontend/vite.config.ts'

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math-tutor-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: math-tutor-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
